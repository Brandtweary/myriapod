# Myriapod self-hostable backends — sanitized template.
#
# Every service here is OPTIONAL; run only the ones whose feature you want:
#   whisper  (GPU)  — speech-to-text.  Skip it for text-only.
#   orpheus  (GPU)  — text-to-speech.  Skip it for text-only. Commented below:
#                     it is BUILT FROM SOURCE, not a pullable image.
#   embed    (CPU)  — memory-dedup embeddings. Skip it; dedup degrades to
#                     string similarity (fail-soft).
#   searxng  (CPU)  — web_search backend. Skip it to drop web search.
#
# Fill in every <placeholder> before use. Bind ports / networks to taste; the
# values below are container-internal defaults.

services:
  # --- Speech-to-text (GPU) -------------------------------------------------
  # faster-whisper behind an OpenAI-compatible API:
  #   POST /v1/audio/transcriptions  (multipart file, response_format=json)
  # The browser resamples to 16 kHz mono WAV and POSTs it here.
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    environment:
      # distil-large-v3 is a fast, accurate default. Any faster-whisper model works.
      WHISPER__MODEL: distil-large-v3
      WHISPER__INFERENCE_DEVICE: cuda
      # Keep the model resident. The default TTL (300s) unloads the model when idle,
      # so the first request after a quiet spell pays a slow cold reload (tens of
      # seconds) and the client may time out. -1 = never unload.
      WHISPER__TTL: "-1"
    ports:
      - "8000:8000"   # container serves the OpenAI API on 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- Text-to-speech (GPU) — BUILD FROM SOURCE, no pullable image ----------
  # The browser speaks the Kyutai streaming msgpack WebSocket protocol on
  # /api/tts_streaming. Any server speaking it works; the reference stack is
  # three pieces, none of them published as a ready image:
  #   orpheus-llama  — Orpheus-3B GGUF on a CUDA llama.cpp server, raw completions.
  #                    https://github.com/canopyai/Orpheus-TTS  (weights)
  #                    https://github.com/ggml-org/llama.cpp    (server image)
  #   orpheus-tts    — Orpheus-FastAPI: prompts the above, decodes SNAC tokens to
  #                    24 kHz mono WAV, serves OpenAI POST /v1/audio/speech.
  #                    https://github.com/Lex-au/Orpheus-FastAPI  (build locally)
  #                    Run the SNAC decode on the GPU; CPU decode is too slow for
  #                    realtime playback.
  #   orpheus-bridge (CPU) — a small adapter you supply: accepts the Kyutai WebSocket,
  #                    accumulates the incoming Text word-frames, chunks them on
  #                    sentence boundaries, POSTs each chunk to /v1/audio/speech,
  #                    and streams the WAV back as Audio (float32 PCM) + per-word
  #                    Text frames, closing the socket to signal end-of-stream.
  #                    Sentence chunking is what bounds time-to-first-audio.
  #
  # orpheus-llama:
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda
  #   command: ["-m", "/models/<orpheus-gguf>", "--host", "0.0.0.0", "--port", "5006",
  #             "-ngl", "999", "--ctx-size", "8192", "--n-predict", "8192",
  #             "--rope-scaling", "linear"]
  #   volumes:
  #     - <host-model-dir>:/models:ro
  #   deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  #
  # orpheus-tts:
  #   image: <build-this-yourself-from-Lex-au/Orpheus-FastAPI>
  #   environment:
  #     ORPHEUS_API_URL: http://orpheus-llama:5006/v1/completions
  #     ORPHEUS_SAMPLE_RATE: "24000"
  #     ORPHEUS_DEFAULT_VOICE: <voice-name>
  #   deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  #
  # orpheus-bridge:
  #   image: <build-this-yourself>
  #   environment:
  #     ORPHEUS_URL: http://orpheus-tts:5005/v1/audio/speech
  #     DEFAULT_VOICE: <voice-name>
  #   ports:
  #     - "8080:8080"   # the WebSocket Caddy proxies /api/tts_streaming to

  # --- Embeddings (CPU) -----------------------------------------------------
  # HF text-embeddings-inference, 384-dim MiniLM. Serves POST /embed on port 80.
  # The proxy's EMBED_BASE points here. Absent → dedup falls back to strings.
  embed:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    command: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2"]
    ports:
      - "8082:80"   # container serves /embed on 80

  # --- Web search (CPU) -----------------------------------------------------
  # SearXNG backing the proxy's SEARXNG_BASE / the web_search tool.
  searxng:
    image: searxng/searxng:latest
    environment:
      # Random 32-byte hex. Generate with:  openssl rand -hex 32
      SEARXNG_SECRET: <searxng-secret>
    ports:
      - "8888:8080"   # container serves on 8080
    volumes:
      # settings.yml MUST enable the json format — the proxy fetches ?format=json:
      #   use_default_settings: true
      #   search:
      #     formats: [html, json]
      #   server:
      #     limiter: false
      - ./settings.yml:/etc/searxng/settings.yml:ro
